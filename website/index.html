<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gaize</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Gaize</h1>

  <section id="connection">
    <p>Companion app: <span id="status">disconnected</span></p>
  </section>

  <section id="goals">
    <h2>Pick a goal</h2>
    <ul id="goal-list"></ul>
  </section>

  <section id="active-goal" hidden>
    <h2 id="active-goal-title"></h2>
    <p id="active-step"></p>
  </section>

  <section id="quiz" hidden>
    <h2>Quiz</h2>
    <div id="quiz-body"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
