<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gaize</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <button class="brand" id="home-link" aria-label="Back to home">
        <span class="brand-mark" aria-hidden="true">◎</span>
        <span class="brand-name">Gaize</span>
      </button>
      <div class="topbar-right">
        <label class="language-picker">
          <span class="sr-only">Spoken language</span>
          <select id="language-select">
            <option value="en-US">English</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
          </select>
        </label>
        <div class="connection" id="connection" role="status" aria-live="polite">
          <span class="dot" id="connection-dot" aria-hidden="true"></span>
          <span id="status">Connecting…</span>
        </div>
      </div>
    </header>

    <main class="content">
      <section id="intro" class="hero">
        <h1>Learn any app, hands-free.</h1>
        <p class="hero-sub">
          Look at a button to hear what it does. Say &ldquo;select&rdquo; when
          you're ready to use it. Pick a goal below and Gaize will guide you
          through it, step by step.
        </p>
      </section>

      <section id="goals" class="goals-section">
        <h2 class="section-title">Goals</h2>
        <ul id="goal-list" class="goal-list"></ul>
      </section>

      <section id="goal-detail" class="panel" hidden>
        <div class="panel-header">
          <h2 id="goal-detail-title"></h2>
          <button class="btn-ghost" id="back-from-detail">Back to goals</button>
        </div>
        <ol class="steps-preview" id="steps-preview"></ol>
        <button class="btn-primary" id="btn-learn">Learn this goal</button>
      </section>

      <section id="active-goal" class="panel" hidden>
        <div class="panel-header">
          <h2 id="active-goal-title"></h2>
          <button class="btn-ghost" id="cancel-goal">Back to goals</button>
        </div>
        <div class="steps-track" id="steps-track"></div>
        <p class="instruction" id="active-step" aria-live="polite"></p>
        <div id="followup-choice" class="followup" hidden>
          <button class="btn-primary" id="btn-quiz">Take a quiz</button>
          <button class="btn-secondary" id="btn-scenario">Try a scenario</button>
        </div>
      </section>

      <section id="quiz" class="panel" hidden>
        <div class="panel-header">
          <h2 id="quiz-heading">Quiz</h2>
          <button class="btn-ghost" id="cancel-quiz">Back to goals</button>
        </div>
        <div id="quiz-body" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Gaize &mdash; eye-tracking control that teaches you the interface, not just operates it.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
