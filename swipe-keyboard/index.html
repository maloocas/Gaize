<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaze Swipe Keyboard</title>
    <link rel="stylesheet" href="./swipe.css" />
  </head>
  <body>
    <div id="kb"></div>
    <script type="module">
      import { loadWords } from './decoder.js';
      import { createSwipeKeyboard } from './keyboard.js';

      const { words, freqs } = await loadWords('./words.txt');
      const kb = createSwipeKeyboard(document.getElementById('kb'), {
        words,
        freqs,
        onWord: (candidates) => console.log('word candidates', candidates),
      });
      window.swipeKeyboard = kb;

      // Mouse stands in for gaze, Space stands in for a blink: each press ends the
      // current word and starts the next 0.5 s later. Backspace deletes a word.
      addEventListener('mousemove', (e) => kb.feed(e.clientX, e.clientY));
      addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code === 'Space') { e.preventDefault(); kb.boundary(); }
        if (e.code === 'Backspace') kb.deleteWord();
      });
    </script>
  </body>
</html>
